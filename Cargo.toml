[package]
name = "moth"
version = "0.1.0"
edition = "2024"
description = "A fast, native YouTube client for the Linux desktop"
license = "GPL-3.0-only"
repository = "https://github.com/sortedcord/moth"
publish = false

[dependencies]
# gpui is vendored from Zed main (wgpu renderer); see scripts/fetch-vendor.sh for the pinned rev.
gpui = { path = "vendor/zed/crates/gpui", default-features = false, features = ["wayland", "profiler"] }
gpui_linux = { path = "vendor/zed/crates/gpui_linux", default-features = false, features = ["wayland"] }
gstreamer = "0.24"
gstreamer-video = "0.24"
raw-window-handle = "0.6"
anyhow = "1"
unicode-segmentation = "1.13.3"
rustypipe = "0.11.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }
gstreamer-app = "0.24"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
async-channel = "2"
futures = "0.3"
# Same major version (and async-io executor) gpui already pulls in, so no second D-Bus stack.
zbus = { version = "5.19", default-features = false, features = ["async-io"] }

# Zed patches these crates to its own forks; gpui relies on them.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }

[profile.dev]
# Keep our crate fast to compile but dependencies (gpui, wgpu, lyon...) optimized.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# With debug assertions, icu_provider turns its log macros into eprintln!, and gpui's line breaker
# (which deliberately skips the Thai/Lao/Khmer/Burmese dictionaries) then prints
# "No segmentation model for complex script" every time such text is laid out: thousands of lines.
[profile.dev.package.icu_provider]
debug-assertions = false

[profile.release]
lto = "thin"
codegen-units = 16
